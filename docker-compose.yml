services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contribution
      POSTGRES_USER: contribution
      POSTGRES_PASSWORD: contribution
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contribution -d contribution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

