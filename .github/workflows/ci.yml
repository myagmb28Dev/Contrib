name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Gradle tests
        run: chmod +x gradlew && ./gradlew test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm run test:e2e

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Build contracts
        run: forge build
      - name: Test contracts
        run: forge test

  deployment-artifacts:
    name: Deployment artifact checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Parse operations scripts
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($path in @("scripts/validate-production-env.ps1", "scripts/backup-postgres.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD/$path", [ref]$tokens, [ref]$parseErrors)
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) { throw ($allErrors | Out-String) }
      - name: Build Backend container
        run: docker build --tag contrib-backend:ci Backend
      - name: Build Frontend container
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.example.com --tag contrib-frontend:ci Frontend
