server:
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true
        same-site: ${SESSION_COOKIE_SAME_SITE:none}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:20000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:600000}
      keepalive-time: ${DATABASE_KEEPALIVE_TIME_MS:30000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:300000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: production

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      environment: production
