spring:
  application:
    name: contribution-backend
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:../.env.local[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/contribution}
    username: ${POSTGRES_USER:contribution}
    password: ${POSTGRES_PASSWORD:contribution}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:20000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:600000}
      keepalive-time: ${DATABASE_KEEPALIVE_TIME_MS:30000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:300000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:github-client-id-not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:github-client-secret-not-configured}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/github/callback/{registrationId}"
            scope:
              - read:user
              - user:email
        provider:
          github:
            user-name-attribute: id

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000}}
  monitoring:
    token: ${MONITORING_TOKEN:}
  github:
    refresh-token-ttl: ${GITHUB_REFRESH_TOKEN_TTL:PT4416H}
    rate-limit:
      max-attempts: ${GITHUB_RATE_LIMIT_MAX_ATTEMPTS:4}
      base-backoff: ${GITHUB_RATE_LIMIT_BASE_BACKOFF:PT1S}
      max-backoff: ${GITHUB_RATE_LIMIT_MAX_BACKOFF:PT30S}
  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY}
  blockchain:
    chain-id: ${BLOCKCHAIN_CHAIN_ID:84532}
    network: ${BLOCKCHAIN_NETWORK:base-sepolia}
    contract-address: ${ATTESTATION_CONTRACT_ADDRESS:}
    rpc-url: ${BASE_SEPOLIA_RPC_URL:https://base-sepolia-rpc.publicnode.com}
    receipt-poll-interval-ms: ${BLOCKCHAIN_RECEIPT_POLL_INTERVAL_MS:3000}
    receipt-poll-enabled: ${BLOCKCHAIN_RECEIPT_POLL_ENABLED:true}
  analysis:
    dispatch-enabled: ${ANALYSIS_DISPATCH_ENABLED:true}
    dispatch-interval-ms: ${ANALYSIS_DISPATCH_INTERVAL_MS:1000}
    job-lease: ${ANALYSIS_JOB_LEASE:PT5M}
  ai:
    provider: ${AI_PROVIDER:rule-based}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      model: "${OPENROUTER_MODEL:google/gemini-2.0-flash-001}"
      site-url: ${OPENROUTER_SITE_URL:${FRONTEND_URL:http://localhost:3000}}
      app-name: ${OPENROUTER_APP_NAME:Contrib}

management:
  endpoints:
    web:
      exposure:
        include: health,info
